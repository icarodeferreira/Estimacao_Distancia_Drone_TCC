name: Reprodução científica em CPU
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-analysis.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduzir_farol.py
      - run: python scripts/integrar_sincronismo_novo_voo.py --dados-dir results/archived/dossie/03_FONTES_CODIGO_INTEGRACAO/FONTES --saida outputs/integracao_reproduzida
      - run: python scripts/gerar_figuras_tabelas.py
      - name: Guardar resultados e ambiente
        if: always()
        run: |
          mkdir -p outputs
          python -m pip freeze > outputs/ambiente.txt
          git rev-parse HEAD > outputs/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducao-cpu
          path: outputs/
          retention-days: 30
